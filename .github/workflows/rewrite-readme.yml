name: Rewrite README icon URLs
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rewrite README icon URLs to this fork's raw URLs
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          RAW = "https://raw.githubusercontent.com/runishiwo/HOMOMIX/main/"
          for f in Path(".").glob("README*.md"):
              t = f.read_text(encoding="utf-8")
              t = re.sub(
                  r'https://(?:raw\.githubusercontent\.com|github\.com)/(?:runishiwo|Vbaethon)/HOMOMIX/(?:blob/)?main/',
                  RAW, t)
              t = re.sub(
                  r'((?:src|href)=")(Icon/[^"]+)"',
                  lambda m: m.group(1) + RAW + m.group(2) + '"', t)
              f.write_text(t, encoding="utf-8")
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: rewrite README icon URLs to raw URLs of this fork"
          git push
