name: Sync fork
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git remote add upstream https://github.com/Vbaethon/HOMOMIX.git
          git fetch upstream
          git merge --ff-only upstream/main
      - name: Replace blob URLs with raw URLs
        run: |
          find . -name "README*.md" -exec sed -i \
            -E 's#https://github\.com/(runishiwo|Vbaethon)/HOMOMIX/blob/main/#https://raw.githubusercontent.com/runishiwo/HOMOMIX/main/#g' {} +
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: replace blob URLs with raw URLs"
          git push
